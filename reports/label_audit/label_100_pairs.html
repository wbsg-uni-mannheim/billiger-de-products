<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Label-Audit: 100 Paare</title>
<style>
 :root{--bg:#fff;--fg:#1f2124;--mut:#6b7076;--line:#e3e6ea;--ok:#0f8a4d;--no:#c62828;--uns:#946200}
 *{box-sizing:border-box}
 body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg)}
 header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;z-index:5}
 .bar{flex:1;min-width:160px;height:8px;background:#eef0f3;border-radius:4px;overflow:hidden}
 .bar span{display:block;height:100%;background:#2b7fff}
 .counts{font-variant-numeric:tabular-nums;color:var(--mut)}
 main{max-width:1180px;margin:0 auto;padding:1rem}
 .cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
 .card{border:1px solid var(--line);border-radius:8px;padding:.8rem}
 .nm{font-weight:600;font-size:1.02rem;margin:.15rem 0 .4rem}
 .meta{color:var(--mut);font-size:.82rem}
 .price{font-variant-numeric:tabular-nums;font-weight:600;margin-top:.3rem}
 .diff{margin-top:.6rem;border-top:1px dashed var(--line);padding-top:.5rem;font-size:.82rem;max-height:340px;overflow:auto}
 .seg{padding:1px 3px;border-radius:3px;margin-bottom:2px;display:block}
 .only{background:#ffebee;box-shadow:inset 0 -2px #f14668}
 .tok-diff{background:#ffe1e6;border-radius:3px;padding:0 2px}
 .full{white-space:pre-wrap;font-size:.78rem;color:#444}
 .btns{display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap}
 button{font:inherit;padding:.5rem .9rem;border:1px solid var(--line);background:#fafbfc;border-radius:6px;cursor:pointer}
 button.sel-1{background:#e4f7ea;border-color:var(--ok);color:var(--ok);font-weight:600}
 button.sel-0{background:#ffebee;border-color:var(--no);color:var(--no);font-weight:600}
 button.sel-u{background:#fff6e0;border-color:var(--uns);color:var(--uns);font-weight:600}
 kbd{font:11px ui-monospace,Menlo,monospace;background:#f1f3f5;border:1px solid var(--line);border-radius:3px;padding:0 4px}
 textarea{width:100%;height:150px;font:12px ui-monospace,Menlo,monospace;margin-top:.5rem}
 .note{width:100%;padding:.4rem;border:1px solid var(--line);border-radius:6px;font:inherit}
 .pid{font:11px ui-monospace,Menlo,monospace;color:var(--mut)}
 .hint{color:var(--mut);font-size:.8rem}
</style></head><body>
<header>
 <strong id="pos">1 / 100</strong>
 <div class="bar"><span id="prog" style="width:1%"></span></div>
 <div class="counts" id="counts"></div>
 <button onclick="prev()">&larr;</button><button onclick="next()">&rarr;</button>
 <button onclick="dl()">Ergebnisse herunterladen</button>
 <button onclick="copyRes()">Kopieren</button>
</header>
<main>
 <div class="hint">Frage: Beziehen sich beide Angebote auf <b>dasselbe reale Produkt</b> (strenge Definition: identische Variante, Größe, Farbe, Modellnummer)? <kbd>1</kbd> Match &middot; <kbd>0</kbd> kein Match &middot; <kbd>u</kbd> unsicher &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd> blättern</div>
 <div class="btns">
  <button id="b1" onclick="setLab(1)">1 &ndash; Match</button>
  <button id="b0" onclick="setLab(0)">0 &ndash; kein Match</button>
  <button id="bu" onclick="setLab('unsure')">u &ndash; unsicher</button>
  <span class="pid" id="pid"></span>
 </div>
 <div class="cols">
  <div class="card" id="L"></div>
  <div class="card" id="R"></div>
 </div>
 <div class="btns"><button onclick="toggleFull()">Volle Beschreibung ein/aus</button></div>
 <input class="note" id="note" placeholder="Notiz (optional)">
 <textarea id="out" readonly></textarea>
</main>

n. • Umweltfreundlich & nachhaltig: Reduziere deinen CO2-Fußabdruck und leiste einen Beitrag zum Schutz unserer Umwelt. • Intelligente Technologie: Mit der intuitiven Bedieneinheit hast du die volle Kontrolle über deine Fahrt. Nutze die VINKA Life E-Bike App auf deinem Smartphone, eine mobile Anwendung, die speziell für Benutzer von Elektrofahrrädern entwickelt wurde, um deren Fahrerlebnis zu verbessern und zu optimieren. Hier sind einige der Hauptfunktionen und Merkmale der App: • Echtzeit-Informationen: Die App bietet Echtzeit-Daten zu Geschwindigkeit, verbleibender Batteriekapazität, zurückgelegter Strecke und Fahrzeit. Diese Informationen helfen dir, den aktuellen Status deines E-Bikes zu überwachen. • Navigation und Routenplanung: Du kannst mit der App Routen planen und navigieren. Die App zeigt Fahrradwege und Straßen an, die für E-Bikes geeignet sind. • Wartungs- und Diagnosedaten: Die App kann Diagnosedaten des E-Bikes anzeigen und Wartungswarnungen geben. So weißt du, wann du dein Fahrrad zur Wartung bringen musst, um eine optimale Leistung sicherzustellen. • Personalisierte Einstellungen: Als Nutzer kannst du verschiedene Einstellungen des E-Bikes über die App anpassen, wie z.B. die Unterstützungsstufe des Motors, um das Fahrerlebnis an deine Bedürfnisse und Vorlieben anzupassen. • Diebstahlschutz: Einige Versionen der App bieten Funktionen wie GPS-Tracking und Benachrichtigungen, wenn das E-Bike unerwartet bewegt wird, um Diebstahl zu verhindern oder das Fahrrad wiederzufinden. • Fitness-Tracking: Die App kann auch fitnessbezogene Daten wie verbrannte Kalorien, Herzfrequenz (wenn verbunden mit einem geeigneten Sensor) und andere Aktivitätsmetriken verfolgen, um dein Training zu optimieren. • Community-Funktionen: Es gibt oft Community-Funktionen, bei denen Benutzer ihre Fahrten teilen, vergleichen und sich mit anderen E-Bike-Enthusiasten austauschen können. Diese Funktionen machen die VINKA E-Bike App zu einem umfassenden Werkzeug für E-Bike-Fahrer, das s nders abgebildet.", "name_en": "Scorpion EXO-1400 Air Fortuna, full-face helmet - Matt Black/Silver - XL"}, "right": {"id": 3719861028, "brand": "Coocazoo", "name": "Coocazoo ScaleRale WWF pine-track", "price": 139.95, "desc": "Für Umweltschützer und Tierfreunde: Im angesagten Dschungel-Style ist der Coocazoo ScaleRale WWF-Schulrucksack ein exotischer Blickfang aus 100% Bio-Baumwolle.Dieser ScaleRale ist etwas für alle zukünftigen Umwelt- und Tierschützer. Er hat neben seinem einzigartigen Look zwei weitere Besonderheiten: Das Material ist zu 100% aus Bio-Baumwollte und im Klett-Patch ist ein spezieller NFC-Chip verbaut.Die biologische Baunwolle von Coocazoo ist ein ökologischer Rohstoff, der ohne Einsatz von giftigen Chemikalien oder Pestiziden angebaut wurde. Der NFC-Chip ist einfach zu aktivieren: Das Smartphone direkt an das Patch halten und mehr interessante und spannende News über den WWF entdecken. Das Klett-Patch des ScaleRale WWF hat nicht nur den integrierten NFC Chip, nein - es ist zudem aus dem Material Pinatex. Grundlage des Materials bilden Fasern die aus übrig gebliebenen Blättern der Ananaspflanzen hergestellt werden.Aus Kleidung wächst dein Kind mit den Jahren raus, aber aus dem höhenverstellbaren ScaleRale-Rucksack garantiert nicht! Dank EASY GROW SYSTEM lässt sich der Rucksack auf die aktuelle Rückenlänge deines Kindes anpassen. Das funktioniert ganz einfach über einen Drehmechanismus im Inneren des Rucksacks. Eine Größenskala hilft dabei, die richtige Einstellung für jede Körpergröße zu finden: Der Rucksack passt ab einer Größe von 135 cm und kann bis 180 cm einfach mitwachsen. Somit hat er immer einen perfekten Sitz, sowohl beim Wechsel auf die neue Schule als auch noch einige Schuljahre später. Das rückenfreundliche EASY GROW SYSTEM von coocazoo ist ausgezeichnet mit dem Gütesiegel der Aktion Gesunder Rücken (AGR) und wird empfohlen von der Bundesarbeitsgemeinschaft für Haltungs- und Bewegungsförderung (BAG) e.V.Viel Stauraum klingt super – solange sich der volle Rucksack auch lange bequem tragen lässt. Bei der ScaleRale Schultasche sind daher Schulterträger, Beckengurt und Rucksackrücken weich gepolstert und aus atmungsaktivem Air-Mesh-Material mit Belüftungskammern. Die Schulterträger sind in ergonomischer S-Form gestaltet und auf Schulterhöhe nahtfrei – so kann nichts reiben oder drücken.Der Brustgurt und der abnehmbare Beckengurt nehmen zusätzlich das Gewicht von den Schultern und verteilen es gleichmäßig. Verstellbare Riemen sorgen dabei für optimale Anpassung und helfen den Schwerpunkt des Rucksacks dicht an den Rücken zu verlagern, sodass der Rucksack beim Tragen nicht nach hinten zieht und dein Kind unnötig belastet.Details:höhenverstellbare Schulterträger (EASY GROW SYSTEM)lageverstellriemenHöhenverstellbarer Brustgurtlängenverstellbarer, abnehmbarer Hüftgurtlängenverstellbare, gepolsterte Schultergurteverstärkter, gepolsterter RückenKompressionsriemenzwei Hauptfächer, Fronttasche, dehnbare Außentaschen, Geheim-EinsteckfachOrdnungsfächerBefestigungsstrapsretroreflektierende Elementeretroreflektierende Schlaufe zur Befestigung eines LED-AnstecklichtsZipper, Schnallen, Klett-Patch austauschbarwasserabweisende ReißverschlüsseKopfhörerausganggepolsterter TragegriffAufhängeschlauferobuster RucksackbodenNFC Chip zum Scannen im Klett-PatchVolumen:&nbsp;30 LiterMaße:&nbsp;45 cm (H) / 30 cm (B) / 20 cm (T)Gewicht:&nbsp;1200 gMaterial:&nbsp;100% Bio-BaumwolleMitwachsender Rucksack dank EASY GROW SYSTEMDas EASY GROW SYSTEM garantiert eine ergonomische Passform während der gesamten Schulzeit: Mit dem einfachen Verstellmechanismus lässt sich die Rückenlänge des Rucksacks jederzeit auf die aktuelle Größe des Kindes anpassen.Dekorationsartikel sind nicht im Lieferumfang enthalten!", "name_en": "Coocazoo ScaleRale WWF pine-track"}}, {"n": 90, "pair_id": "1456878056#2160958435", "left": {"id": 1456878056, "brand": "alessandro", "name": "alessandro Striplac, Peel or Soak, Panama Hut", "price": 18.99, "desc": "ales const KEYSTORE = 'wdc-audit-v1';
let res = JSON.parse(localStorage.getItem(KEYSTORE) || '{}');
let i = 0, showFull = false;

function segs(t){return (t||'').split(/,\s*/).map(s=>s.trim()).filter(s=>s.length>1)}
function toks(t){return new Set((t||'').toLowerCase().split(/[^\wäöüß.,-]+/).filter(Boolean))}
function nameDiff(a,b){const B=toks(b);return (a||'').split(/(\s+)/).map(w=>{
  const k=w.toLowerCase().replace(/[^\wäöüß.,-]/g,'');
  return (k && !B.has(k)) ? '<span class="tok-diff">'+esc(w)+'</span>' : esc(w)}).join('')}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function side(o, other){
  const mine=segs(o.desc), theirs=new Set(segs(other.desc).map(s=>s.toLowerCase()));
  const body = showFull
    ? '<div class="full">'+esc(o.desc)+'</div>'
    : mine.map(s=>{const only=!theirs.has(s.toLowerCase());
        return '<span class="seg'+(only?' only':'')+'">'+esc(s)+'</span>'}).join('');
  return '<div class="meta">'+esc(o.brand||'&ndash;')+' &middot; <span class="pid">offer '+o.id+'</span></div>'
   +'<div class="nm">'+nameDiff(o.name,other.name)+'</div>'
   +'<div class="meta">'+esc(o.name_en||'')+'</div>'
   +'<div class="price">'+(o.price!=null?Number(o.price).toFixed(2)+' &euro;':'&ndash;')+'</div>'
   +'<div class="diff">'+body+'</div>';
}
function render(){
  const d=DATA[i];
  document.getElementById('L').innerHTML=side(d.left,d.right);
  document.getElementById('R').innerHTML=side(d.right,d.left);
  document.getElementById('pos').textContent=(i+1)+' / '+DATA.length;
  document.getElementById('prog').style.width=((i+1)/DATA.length*100)+'%';
  document.getElementById('pid').textContent='pair_id '+d.pair_id;
  const r=res[d.pair_id]||{};
  for(const [id,v] of [['b1',1],['b0',0],['bu','unsure']]){
    const el=document.getElementById(id); el.className = (r.label===v)?('sel-'+(v==='unsure'?'u':v)):'';
  }
  document.getElementById('note').value=r.note||'';
  const done=Object.values(res).filter(r=>r.label!==undefined).length;
  document.getElementById('counts').textContent=done+' gelabelt, '+(DATA.length-done)+' offen';
  document.getElementById('out').value=JSON.stringify(res,null,1);
}
function setLab(v){const d=DATA[i];res[d.pair_id]={n:d.n,label:v,note:document.getElementById('note').value};
  localStorage.setItem(KEYSTORE,JSON.stringify(res));render();setTimeout(()=>{if(i<DATA.length-1){i++;render()}},120)}
function next(){if(i<DATA.length-1){i++;render()}}
function prev(){if(i>0){i--;render()}}
function toggleFull(){showFull=!showFull;render()}
document.getElementById('note').addEventListener('change',e=>{const d=DATA[i];
  res[d.pair_id]=Object.assign({n:d.n},res[d.pair_id]||{},{note:e.target.value});
  localStorage.setItem(KEYSTORE,JSON.stringify(res))});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='1')setLab(1);else if(e.key==='0')setLab(0);else if(e.key.toLowerCase()==='u')setLab('unsure');
  else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev()});
function rows(){return DATA.map(d=>{const r=res[d.pair_id]||{};
  return [d.n,d.pair_id,r.label===undefined?'':r.label,(r.note||'').replace(/"/g,"'")]})}
function csv(){return 'n,pair_id,my_label,note\n'+rows().map(r=>r.map(x=>'"'+x+'"').join(',')).join('\n')}
function dl(){const b=new Blob([csv()],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='audit_labels.csv';a.click()}
function copyRes(){navigator.clipboard.writeText(csv())}
render();
</script></body></html>
